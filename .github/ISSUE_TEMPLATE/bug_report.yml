name: Bug report
description: Report a reproducible defect in AccessPath.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve AccessPath. Do not include passwords, API keys, personal data, or private campus information."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
      placeholder: A clear description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide minimal, numbered steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node version, and relevant app configuration (without secrets).
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Redact personal information, tokens, and sensitive data before sharing.
    validations:
      required: false
